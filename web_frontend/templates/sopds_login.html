{% extends "sopds_main.html" %}
{% load i18n %}

{% block ext-body %}
<form method="post" action="{% url "web:login" %}">
  {% csrf_token %}
  <div class="row">
    <div class="small-6 medium-4 large-3 small-centered columns">
      <label>{% trans "Username" %}
        <input type="text" name="username" autocomplete="username" placeholder="{% trans "Enter Username" %}">
      </label>
      <label>{% trans "Password" %}
        <input type="password" name="password" autocomplete="current-password" placeholder="{% trans "Enter Password" %}">
      </label>
      <input type="submit" class="button" value="{% trans "Log in" %}">
    </div>
  </div>
</form>
{% endblock %}
