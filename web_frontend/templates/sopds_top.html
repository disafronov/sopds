{% load i18n static %}

<div class="top-bar top-bar--search">
  <div class="top-bar-title">
    <span class="main-menu-toggle">
      <button class="menu-icon" type="button" aria-controls="main_menu" aria-expanded="false">
        <span class="show-for-sr">{% trans "Toggle navigation" %}</span>
      </button>
    </span>
    <div class="title-bar-title">
      <a href="/">
        <div class="show-for-medium">SIMPLE OPDS CATALOG</div>
      </a>
    </div>
  </div>

  <div class="top-bar-right">
    <form method="get" action="{% url "web:searchbooks" %}" id="searchform" class="top-bar-search">
      {% csrf_token %}

      <div class="input-group">
        <input class="input-group-field" type="search" name="searchterms" placeholder="Search" id="main_searchbox" minlength="3" required>

        <div class="input-group-button">
          <button class="button" type="submit" name="submit">{% trans "Search" %}</button>
        </div>

        <div class="input-group-button">
          <button
            class="button arrow-only search-dropdown-toggle"
            type="button"
            aria-controls="search-dropdown"
            aria-expanded="false"
          ><span class="show-for-sr">{% trans "Choose search type" %}</span></button>
        </div>
        <input type="hidden" name="page" value="0">
      </div>

      <div class="search-dropdown" id="search-dropdown" hidden>
        <div class="row">
          <fieldset>
            <legend class="show-for-sr">{% trans "Choose Search Type:" %}</legend>
            <label class="search-dropdown__option"><input type="radio" name="searchtype" value="m" id="title" data-search-url="{% url "web:searchbooks" %}" {% if searchobject == "title" or not searchobject %}checked{% endif %}><span>{% trans "Title" %}</span></label>
            <label class="search-dropdown__option"><input type="radio" name="searchtype" value="m" id="author" data-search-url="{% url "web:searchauthors" %}" {% if searchobject == "author" %}checked{% endif %}><span>{% trans "Author" %}</span></label>
            <label class="search-dropdown__option"><input type="radio" name="searchtype" value="m" id="series" data-search-url="{% url "web:searchseries" %}" {% if searchobject == "series" %}checked{% endif %}><span>{% trans "Series" %}</span></label>
          </fieldset>
        </div>
      </div>
    </form>
  </div>
</div>
