# DBHub (bytebase/dbhub) multi-database configuration for local SOPDS dev.
# Local dev creds from compose.yml (postgres:17 / mariadb:lts services).
[[sources]]
id = "postgres"
dsn = "postgresql://sopds:sopds@127.0.0.1:5432/sopds"

[[sources]]
id = "mariadb"
dsn = "mysql://sopds:sopds@127.0.0.1:3306/sopds"
